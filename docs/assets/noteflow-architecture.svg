<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">NoteFlow AI architecture</title><desc id="desc">Frontend communicates with FastAPI backend, which coordinates persistence, local AI services, and export routes.</desc>
  <rect width="1200" height="520" rx="24" fill="#f6f8fb"/>
  <g font-family="Inter,Segoe UI,sans-serif" fill="#12233f"><text x="56" y="54" font-size="24" font-weight="700">Local-first application architecture</text><text x="56" y="82" font-size="15" fill="#64748b">The UI, API, data, and model services run within the project’s local workflow.</text>
  <rect x="70" y="145" width="270" height="260" rx="20" fill="#fff" stroke="#b9c8d8"/><text x="100" y="185" font-size="19" font-weight="700">Frontend</text><text x="100" y="215" font-size="15" fill="#64748b">React + Vite</text><rect x="100" y="245" width="210" height="44" rx="10" fill="#e8f6f3"/><text x="120" y="273" font-size="14">Dashboard &amp; workflows</text><rect x="100" y="304" width="210" height="44" rx="10" fill="#eef2f7"/><text x="120" y="332" font-size="14">Review, compare, export</text>
  <rect x="465" y="115" width="270" height="320" rx="20" fill="#12233f"/><text x="495" y="157" font-size="19" font-weight="700" fill="#fff">Backend API</text><text x="495" y="187" font-size="15" fill="#b8c6d8">FastAPI + SQLAlchemy</text><rect x="495" y="220" width="210" height="44" rx="10" fill="#29496f"/><text x="515" y="248" font-size="14" fill="#fff">Processing routes</text><rect x="495" y="279" width="210" height="44" rx="10" fill="#29496f"/><text x="515" y="307" font-size="14" fill="#fff">Tasks &amp; audit history</text><rect x="495" y="338" width="210" height="44" rx="10" fill="#29496f"/><text x="515" y="366" font-size="14" fill="#fff">Model status &amp; health</text>
  <rect x="860" y="145" width="270" height="260" rx="20" fill="#fff" stroke="#b9c8d8"/><text x="890" y="185" font-size="19" font-weight="700">Local services</text><text x="890" y="215" font-size="15" fill="#64748b">No cloud dependency required</text><text x="890" y="260" font-size="15">Qwen3-ASR / Mega-ASR</text><text x="890" y="295" font-size="15">PP-OCRv6</text><text x="890" y="330" font-size="15">Ollama · qwen3:4b</text><text x="890" y="365" font-size="15">SQLite/PostgreSQL · exports</text>
  <path d="M340 275h125M735 275h125" stroke="#91a4b9" stroke-width="4" marker-end="url(#a)" marker-start="url(#b)"/>
  <text x="450" y="480" font-size="14" fill="#64748b">Migrations: Alembic · Runtime: local virtual environment + pnpm</text></g><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#91a4b9"/></marker><marker id="b" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0L0 5L10 10z" fill="#91a4b9"/></marker></defs>
</svg>
